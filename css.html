<!DOCTYPE html>
<html>
<head>
    <title>css style</title>
</head>
<body>
    <h1>CSS STYLE FORMS</h1>
    <form>
        <label for="username">Enter username:</label>
        <input type="text"id="username"name="username" placeholder="username" required>
        <br><br>
        <label for="e-mail">Enter e-mail</label>
        <input type="email"id="e-mail"name="e-mail" placeholder="e-mail" required>
        <br><br>
        <label for="password">Enter password:</label>
        <input type="password"id="password"name="password" placeholder="password" required>
        <br><br>
        <p>select your age:</p>
        <input type="radio"name="age"values="0-25" id="option-1"
        <label for="option-1">0-25</label>
        <input type="radio"name="age"values="26-40" id="option-2">
        <label for="option-2">26-40</label>
        <input type="radio"name="age"values="41-56" id="option-3">
        <label for="option-3">41-56</label>
        <br><br>
        <label for="question">security question:</label>
        <select name="question"id="question">
            <option value="q1">whats your favourite pet</option>
            <option value="q2">whats your most asked question</option>
            <option value="q3">how do you react under pressure</option>
         </select>
         <br><br>
         <label for="answer">security question answer</label>
         <input type="text"id="answer"name="answer">
         <br><br>
         <label for="bio">Your bio:</label><br>
         <textarea name="bio" id="bio" cols="30" rows="10" placeholder="About you...."></textarea>
         <br><br>
         <input type="submit" value="submit the form">

</form>
</body>
</html>
